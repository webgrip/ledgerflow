name: '[Workflow] On Source Change'

# Forgejo mirror of .github/workflows/on_source_change.yml (forgejo-port-workflows). Adaptations:
#   - PHP jobs run in `container: composer:2.8.5` (PHP 8.4, satisfies the app's ^8.3) with a plain
#     `git clone` checkout — JS actions (actions/checkout, actions/cache, shivammathur/setup-php)
#     cannot run inside a container that ships no Node, and the per-job composer install replaces
#     the actions/cache vendor handoff
#   - services are addressed by SERVICE NAME (postgres/redis), not 127.0.0.1: on this runner every
#     job is a container job, so services join the job network instead of publishing host ports
#   - the test job adds nodejs/npm via apk (alpine) for the Vite build
#   - release runs the shared composite action with WEBGRIP_CI_TOKEN (Forgejo reserves the
#     FORGEJO_ prefix, so a stored secret of that name cannot exist); publish plugin is gated in
#     .releaserc.js (Gitea plugin on Forgejo, @semantic-release/github on the GitHub mirror)
#   - pull_request triggers dropped: Forgejo fires push events for the branches themselves
#   - Flux-credential steps dropped: the app requires the FREE livewire/flux (packagist, no auth);
#     re-add via env-var shell guards if flux-pro ever lands — `secrets.*` inside a step `if:`
#     makes this act_runner drop the whole workflow SILENTLY (zero tasks, nothing logged)
#   - boost-drift.yml and the *.agent.md files stay GitHub-side (gh-aw / PR-annotation specific)

concurrency:
  group: source-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'stubs/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - 'phpunit.eval.xml'
      - 'pint.json'
      - 'playwright.config.ts'
      - 'vite.config.js'
      - '.releaserc.js'
      - '.forgejo/workflows/on_source_change.yml'

jobs:
  lint:
    name: 'Lint'
    runs-on: docker
    container:
      image: composer:2.8.5
    steps:
      - name: 'Checkout (plain git — JS actions cannot run in this container)'
        run: |
          set -eu
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --depth 50 --branch "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "${GITHUB_SHA}" 2>/dev/null || echo "note: ${GITHUB_SHA} outside clone depth; using branch tip"


      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint
        run: composer lint:check

  static-analysis:
    name: 'Static Analysis'
    runs-on: docker
    container:
      image: composer:2.8.5
    needs: [lint]
    if: >
      always()
      && needs.lint.result == 'success'
    steps:
      - name: 'Checkout (plain git — JS actions cannot run in this container)'
        run: |
          set -eu
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --depth 50 --branch "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "${GITHUB_SHA}" 2>/dev/null || echo "note: ${GITHUB_SHA} outside clone depth; using branch tip"


      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

  test:
    name: 'Test'
    runs-on: docker
    container:
      image: composer:2.8.5
    needs: [static-analysis]
    if: >
      always()
      && needs.static-analysis.result == 'success'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: laravel_testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
      redis:
        image: redis:7

    steps:
      - name: 'Checkout (plain git — JS actions cannot run in this container)'
        run: |
          set -eu
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --depth 50 --branch "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "${GITHUB_SHA}" 2>/dev/null || echo "note: ${GITHUB_SHA} outside clone depth; using branch tip"

      - name: Install Node (alpine)
        run: apk add --no-cache nodejs npm

      - name: Install Node dependencies
        run: npm ci


      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure test environment
        run: |
          php artisan key:generate
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=postgres" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=laravel_testing" >> .env
          echo "DB_USERNAME=sail" >> .env
          echo "DB_PASSWORD=password" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "CACHE_STORE=redis" >> .env
          echo "QUEUE_CONNECTION=redis" >> .env

      - name: Build assets
        run: npm run build

      - name: Wait for Postgres
        run: |
          i=0
          until php -r 'exit(@fsockopen("postgres", 5432) ? 0 : 1);'; do
            i=$((i+1)); [ $i -ge 30 ] && { echo "postgres never became reachable"; exit 1; }
            sleep 2
          done

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Pest
        run: ./vendor/bin/pest --compact

  release:
    name: 'Release'
    runs-on: docker
    needs: [static-analysis, test]
    if: >
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
      && needs.static-analysis.result == 'success'
      && needs.test.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Semantic Release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@main
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

# validate: full pipeline now that Actions fire on this repo
